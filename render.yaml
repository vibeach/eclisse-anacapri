services:
  - type: web
    name: eclisse-anacapri
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 30
    healthCheckPath: /healthz
    envVars:
      - key: ECLISSE_ADMIN_KEY
        sync: false
      - key: ECLISSE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eclisse-anacapri-db
          property: connectionString

databases:
  - name: eclisse-anacapri-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
