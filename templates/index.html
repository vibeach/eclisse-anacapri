{% extends "_base.html" %}
{% block content %}
<section class="game-wrap">
  <div class="game-card">
    <p class="eyebrow">Apericena eclissi al tramonto sul mare</p>
    <h1>Sei sulla lista?</h1>
    <p class="intro-game">
      Dimostra di conoscere Ale per accedere ai dettagli.
    </p>

    {% if fail %}
      <div class="notice error">Hai sbagliato troppe volte 😅 Rifacciamo dall'inizio.</div>
    {% endif %}
    {% if error %}
      <div class="notice error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('quiz') }}" class="game-form">
      <label>
        <span>Come ti chiami?</span>
        <input type="text" name="name" required maxlength="80" autofocus placeholder="Nome e cognome">
      </label>
      <button type="submit" class="btn">Iniziamo 🌒</button>
    </form>
  </div>
</section>
{% endblock %}
